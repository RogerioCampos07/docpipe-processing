[project]
name = "docpipe-processing"
version = "0.1.0"
description = "Document processing microservice for the DocPipe pipeline, responsible for consuming ingestion events, processing stored documents, and publishing results for downstream services."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "taskipy>=1.14.1",
    "typos>=1.49.0",
    "mypy>=2.3.1",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings --strict-markers'
markers = [
    'unit: tests for isolated behavior',
    'integration: tests joining implemented components',
    'contract: tests for verified external contracts',
    'persistence: tests for Processing-owned persistence',
    'consumer: tests for the message consumer',
    'storage: tests for the storage adapter',
    'e2e: tests for the implemented end-to-end flow',
]

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
format-check = 'ruff format --check .'
typecheck = 'mypy'
pre_test = 'task lint'
test = 'pytest --cov=docpipe_processing --cov-report=term-missing --cov-fail-under=80 -vv'
post_test = 'coverage html'
typos = 'typos'
quality = 'task format-check && task typecheck && task test && task typos'
