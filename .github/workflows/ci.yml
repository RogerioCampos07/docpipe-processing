name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.20
          python-version: '3.14.4'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14.4
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run task typecheck
      - run: uv run task lint
      - run: uv run ruff format --check
      - run: uv run typos

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: processing_test
          POSTGRES_USER: processing_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U processing_test -d processing_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PROCESSING_TEST_DATABASE_URL: postgresql+psycopg://processing_test:synthetic-ci-only@127.0.0.1:5432/processing_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.20
          python-version: '3.14.4'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14.4
      - run: uv sync --locked
      - run: >-
          uv run pytest --cov=docpipe_processing
          --cov-report=term-missing --cov-fail-under=80

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROCESSING_DATABASE_URL: postgresql+psycopg://processing_test:synthetic-ci-only@127.0.0.1:5432/processing_test
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: processing_test
          POSTGRES_USER: processing_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U processing_test -d processing_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag docpipe-processing:ci .
      - name: Apply migrations from the runtime image
        run: >-
          docker run --rm --network host
          --env PROCESSING_DATABASE_URL
          docpipe-processing:ci uv run --no-sync alembic upgrade head
      - name: Check unprivileged runtime
        run: test "$(docker run --rm docpipe-processing:ci id -u)" != 0
      - name: Check health, metrics and persisted domain resource
        shell: bash
        run: |
          set -euo pipefail
          container_name=docpipe-processing-smoke

          processing_id="$(docker run --rm --interactive --network host \
            --env PROCESSING_DATABASE_URL \
            docpipe-processing:ci python - <<'PY'
          from datetime import UTC, datetime
          from uuid import uuid4

          from docpipe_processing.domain import ProcessingJob
          from docpipe_processing.persistence import (
              ProcessingJobRepository,
              create_database_engine,
              create_session_factory,
          )
          from docpipe_processing.processing_input import ProcessingInput

          processing_id = uuid4()
          engine = create_database_engine()
          try:
              repository = ProcessingJobRepository(create_session_factory(engine))
              repository.create(
                  ProcessingJob.create(
                      processing_id=processing_id,
                      source_event_id=f'smoke-event-{processing_id}',
                      document_id='smoke-document',
                      created_at=datetime(2026, 1, 1, tzinfo=UTC),
                  ),
                  input=ProcessingInput(
                      storage_key='private-smoke-object',
                      media_type='application/pdf',
                      size_bytes=0,
                      sha256='0' * 64,
                  ),
              )
          finally:
              engine.dispose()
          print(processing_id)
          PY
          )"

          cleanup() {
            docker logs "$container_name" || true
            docker stop --time 5 "$container_name" >/dev/null 2>&1 || true
            docker rm "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --network host \
            --env PROCESSING_DATABASE_URL \
            --env PROCESSING_HOST=127.0.0.1 \
            --env PROCESSING_PORT=18000 \
            docpipe-processing:ci

          healthy=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" -ne 1 ]]; then
            echo 'Container did not become healthy in 30 seconds.'
            exit 1
          fi

          metrics_payload="$(curl --fail --silent --show-error http://127.0.0.1:18000/metrics)"
          grep -q 'docpipe_http_requests_total' <<< "$metrics_payload"

          curl --fail --silent --show-error \
            "http://127.0.0.1:18000/v1/processing-jobs/$processing_id" \
            | python3 -c '
          import json
          import sys

          processing_id = sys.argv[1]
          body = json.load(sys.stdin)
          assert body == {
              "processing_id": processing_id,
              "source_event_id": f"smoke-event-{processing_id}",
              "document_id": "smoke-document",
              "correlation_id": None,
              "status": "RECEIVED",
              "attempts": 0,
              "created_at": "2026-01-01T00:00:00Z",
              "updated_at": "2026-01-01T00:00:00Z",
              "started_at": None,
              "finished_at": None,
              "failure_reason": None,
          }, body
          print("Domain container smoke passed")
          ' "$processing_id"
